<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>体感游戏中心</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="game.css" />
  <style>
    .hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }
    .hub-card {
      display: block;
      padding: 22px 20px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s, transform 0.12s;
      box-shadow: var(--shadow);
    }
    .hub-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .hub-card h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }
    .hub-card p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }
    .hub-card .tag {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.72rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>体感游戏中心</h1>
          <p class="sub">手势识别 · 虚拟操作 · 休闲挑战</p>
        </div>
      </div>
      <a class="btn mini" href="index.html">采集与 3D 复现</a>
    </header>

    <main>
      <p style="color:var(--text-muted);margin:0 0 16px;">
        同一套摄像头手部识别能力，三种玩法。推荐先玩<b>切水果</b>练手感。
      </p>
      <div class="hub-grid">
        <a class="hub-card" href="fruit.html">
          <h2>🍉 体感切水果</h2>
          <p>指尖当刀划开飞来的水果，避开炸弹，刷连击高分。上手最轻松。</p>
          <span class="tag">难度 ★☆☆ · 强烈推荐</span>
        </a>
        <a class="hub-card" href="game.html">
          <h2>🧱 体感搭积木</h2>
          <p>移动牵引滑动的方块，捏合放下叠塔，握拳急刹。讲究时机。</p>
          <span class="tag">难度 ★★☆ · 手眼协调</span>
        </a>
        <a class="hub-card" href="assemble.html">
          <h2>🖥️ 双手虚拟装机</h2>
          <p>双手抓取零件装进机箱卡槽，适合演示虚拟装配与主从操作。</p>
          <span class="tag">难度 ★★★ · 教学向</span>
        </a>
      </div>
    </main>

    <footer class="footer">
      <span>本地运行 · MediaPipe 手部识别 · 可扩展遥操作</span>
    </footer>
  </div>
</body>
</html>
